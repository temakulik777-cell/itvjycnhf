name: Build Internal Source (17.zip)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip 17.zip
      run: |
        unzip 17.zip -d project_files
        echo "=== Ищем папку Jni ==="
        find project_files -type d -name "Jni"

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Build with ndk-build
      run: |
        # Находим путь к папке, где лежит папка Jni
        ANDROID_DIR=$(find project_files -type d -name "Jni" | xargs dirname | head -n 1)
        
        if [ -z "$ANDROID_DIR" ]; then
          echo "Ошибка: Не найдена папка Jni! Проверь структуру архива."
          exit 1
        fi
        
        cd "$ANDROID_DIR"
        echo "Сборка в папке: $(pwd)"
        
        # Запускаем сборку. 
        # Так как файл сборки называется 'build' (а не Android.mk), указываем его явно.
        ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./build APP_ABI="arm64-v8a"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Internal-Lib-17
        # Ищем все собранные .so файлы
        path: "**/libs/arm64-v8a/*.so"
